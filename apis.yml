aid: transfr
name: Transfr
description: 'Transfr Inc. is a New York City based workforce-education company that builds
  immersive virtual-reality job-training simulations for schools, colleges, workforce
  development boards, non-profits and justice-impacted programs. Its two products are Transfr
  Trek, a career-exploration program covering more than 150 occupations, and Transfr Train,
  hands-on VR skills training across sectors including manufacturing, healthcare, construction,
  automotive, aviation, diesel technology, electrical construction and hospitality. Learner
  and classroom data is administered through the Transfr dashboard, with rostering and single
  sign-on delivered through third-party education platforms (Clever, ClassLink, Canvas) rather
  than through a Transfr-published API. As of this profiling pass Transfr publishes no public
  developer program, API reference or machine-readable contract.'
